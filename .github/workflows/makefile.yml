name: Makefile CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check that the emoji assets and their XML are in sync
        run: pwsh -NoProfile -File tools/fetch-emoji-assets.ps1 -SkipDownload -Check

      - name: Build the mod archive
        run: make

      - name: Upload the mod archive
        uses: actions/upload-artifact@v4
        with:
          name: mod-zip-${{ github.sha }}
          path: mod.zip
          if-no-files-found: error
